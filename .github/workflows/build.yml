name: Build Dimension of the Day

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          cat project.tar.gz.b64.01 project.tar.gz.b64.02 | base64 -d > project.tar.gz
          tar -xzf project.tar.gz
          test -f dimensionday/build.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: dimensionday
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: dimensionday-jar
          path: dimensionday/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
